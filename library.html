<!DOCTYPE html>
<html>
<head>
<style>
.test-card { display: block; }
.test-card.hidden { display: none !important; }
.book-btn { padding: 8px 12px; margin: 5px; cursor: pointer; }
.book-btn.active { background: red; color: white; }
</style>
</head>
<body>

<h1>Practice Library</h1>

<button class="book-btn active" data-book="all">All</button>
<button class="book-btn" data-book="10">Cambridge 10</button>
<button class="book-btn" data-book="11">Cambridge 11</button>

<hr>

<div id="content">
  <div class="test-card" data-book="10">Cambridge 10 Test 1 ✅</div>
  <div class="test-card" data-book="10">Cambridge 10 Test 2 ✅</div>
  <div class="test-card" data-book="11">Cambridge 11 Test 1 ✅</div>
  <div class="test-card" data-book="11">Cambridge 11 Test 2 ✅</div>
  <div class="test-card" data-book="11">Cambridge 11 Test 3 ✅</div>
  <div class="test-card" data-book="11">Cambridge 11 Test 4 ✅</div>
</div>

<script>
const buttons = document.querySelectorAll('.book-btn');
const cards = document.querySelectorAll('.test-card');

buttons.forEach(btn => {
  btn.onclick = function() {
    buttons.forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    const selected = this.getAttribute('data-book');
    
    cards.forEach(card => {
      const cardBook = card.getAttribute('data-book');
      if (selected === 'all' || cardBook === selected) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });
  };
});
</script>

</body>
</html>
